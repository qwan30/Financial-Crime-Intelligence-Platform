version: 2
updates:
  # 1. Automatically update GitHub Actions Workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # 2. Automatically update Python Dependencies
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # 3. Automatically update Frontend Packages (when apps/investigator-web exists)
  - package-ecosystem: "npm"
    directory: "/apps/investigator-web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
