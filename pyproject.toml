[project]
name = "financial-crime-intelligence-platform"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.11,<3",
  "polars>=1.30,<2",
  "pyarrow>=20,<21",
  "scikit-learn>=1.6,<2",
  "lightgbm>=4.6,<5",
  "networkx>=3.4,<4",
]

[dependency-groups]
dev = ["hatchling==1.27.0", "pytest>=8.3,<9", "ruff>=0.11,<1", "mypy>=1.15,<2"]
graph = ["torch>=2.7,<3", "torch-geometric>=2.6,<3"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fincrime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["fincrime"]
